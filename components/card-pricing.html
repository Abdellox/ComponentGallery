<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{margin:0;display:grid;place-items:center;height:100vh;background:radial-gradient(1200px 600px at 20% -10%,#7c3aed22,transparent),radial-gradient(1000px 500px at 100% 0%,#22d3ee22,transparent),#0f172a;font-family:system-ui,sans-serif}
 .card{width:340px;background:#fff;border-radius:13px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative;overflow:hidden}
 .card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#6d28d9,#22d3ee,#f97316)}
 .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#f1f5f9;color:#6d28d9;padding:6px 10px;border-radius:999px}
 .dot{width:6px;height:6px;border-radius:50%;background:#6d28d9;box-shadow:0 0 0 4px rgba(109,40,217,.15)}
 .name{margin-top:18px;font-size:22px;font-weight:800;color:#0f172a}
 .desc{margin-top:6px;font-size:14px;color:#64748b;line-height:1.5}
 .price-row{margin-top:22px;display:flex;align-items:baseline;gap:6px}
 .price{font-size:42px;font-weight:800;color:#0f172a}
 .suffix{font-size:15px;font-weight:600;color:#94a3b8}
 .div{height:1px;background:#e2e8f0;margin:22px 0}
 .feat{list-style:none;display:flex;flex-direction:column;gap:12px}
 .feat li{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:#334155}
 .check{width:22px;height:22px;border-radius:50%;background:#f1f5f9;display:grid;place-items:center;font-size:12px}
 .btn{margin-top:24px;width:100%;padding:14px;border:0;border-radius:12px;font-size:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6d28d9,#4f46e5);cursor:pointer; transition: 200ms all;}
 .btn:hover{transform:translateY(-2px)}
 .note{margin-top:12px;text-align:center;font-size:12px;color:#94a3b8}
</style>
</head>
<body>
  <div class="card">
    <div class="badge"><span class="dot"></span> Most Popular</div>
    <h2 class="name">Pro Creator</h2>
    <p class="desc">Perfect for solo creators and small teams shipping fast.</p>
    <div class="price-row"><span class="price">$29</span><span class="suffix">/ month</span></div>
    <div class="div"></div>
    <ul class="feat">
      <li><span class="check">✓</span> 10 projects & unlimited previews</li>
      <li><span class="check">✓</span> 100GB bandwidth + CDN</li>
      <li><span class="check">✓</span> Custom domains & SSL</li>
      <li><span class="check">✓</span> Team comments & versioning</li>
    </ul>
    <button class="btn">Start 14-day free trial</button>
    <p class="note">No credit card required</p>
  </div>
</body>
</html>
