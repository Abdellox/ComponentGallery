<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #eef1f8;
      height: 100vh;
      display: grid;
      place-items: center;
    }
    .profile-card {
      background: #fff;
      border-radius: 16px;
      padding: 2rem;
      width: 280px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }
    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6d5dfc, #22c1c3);
      display: grid;
      place-items: center;
      margin: 0 auto 1rem;
      color: #fff;
      font-size: 2.2rem;
      font-weight: 700;
    }
    .profile-card h3 { font-size: 1.2rem; color: #1f2430; }
    .profile-card .role { color: #5c6474; font-size: 0.9rem; margin: 0.2rem 0 1rem; }
    .stats {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid #e3e6ef;
      padding-top: 1rem;
    }
    .stats div strong { display: block; color: #1f2430; }
    .stats div span { font-size: 0.75rem; color: #5c6474; }
  </style>
</head>
<body>
  <div class="profile-card">
    <div class="avatar">🙂</div>
    <h3>Alex Johnson</h3>
    <p class="role">Frontend Developer</p>
    <div class="stats">
      <div><strong>24</strong><span>Projects</span></div>
      <div><strong>1.2k</strong><span>Followers</span></div>
      <div><strong>98</strong><span>Following</span></div>
    </div>
  </div>
</body>
</html>
