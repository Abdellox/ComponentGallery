<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #0e1a2b;
      height: 100vh;
      display: grid;
      place-items: center;
    }
    .navbar {
      width: 640px;
      max-width: 92%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: 0.9rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .brand { font-weight: 800; font-size: 1.1rem; }
    .links { display: flex; gap: 1.4rem; }
    .links a { color: rgba(255, 255, 255, 0.85); text-decoration: none; font-size: 0.9rem; }
    .links a:hover { color: #6d5dfc; }
    .cta {
      background: linear-gradient(135deg, #6d5dfc, #22c1c3);
      color: #fff;
      border: none;
      padding: 0.5rem 1.1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <span class="brand">◆ Nova</span>
    <div class="links">
      <a href="#">Home</a>
      <a href="#">Features</a>
      <a href="#">Pricing</a>
      <a href="#">About</a>
    </div>
    <button class="cta">Sign up</button>
  </nav>
</body>
</html>
