<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      margin: 0;
      display: grid;
      place-items: center;
      height: 100vh;
      background: #111827;
      font-family: Arial, sans-serif;
    }

    .gradient-btn {
      padding: 14px 28px;
      border: none;
      border-radius: 30px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .gradient-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
    }
  </style>
</head>

<body>
  <button class="gradient-btn">Gradient Button</button>
</body>
</html>
