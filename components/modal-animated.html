<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f7;
      height: 100vh;
      display: grid;
      place-items: center;
    }
    .btn-open {
      border: none;
      background: linear-gradient(135deg, #6d5dfc, #22c1c3);
      color: #fff;
      font-weight: 700;
      padding: 0.9rem 1.8rem;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 14, 30, 0.6);
      display: grid;
      place-items: center;
      z-index: 10;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }
    .overlay.open { opacity: 1; visibility: visible; }
    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 2rem;
      width: min(380px, 88%);
      text-align: center;
      transform: scale(0.8);
      transition: transform 0.25s ease;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }
    .overlay.open .modal { transform: scale(1); }
    .modal h3 { margin-bottom: 0.5rem; color: #1f2430; }
    .modal p { color: #5c6474; font-size: 0.9rem; margin-bottom: 1.3rem; }
    .modal-actions { display: flex; gap: 0.6rem; justify-content: center; }
    .btn-cancel {
      border: 1px solid #e3e6ef;
      background: #fff;
      color: #5c6474;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn-confirm {
      border: none;
      background: #6d5dfc;
      color: #fff;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <button class="btn-open" onclick="document.getElementById('overlay').classList.add('open')">Open modal</button>
  <div class="overlay" id="overlay" onclick="if(event.target===this)this.classList.remove('open')">
    <div class="modal" role="dialog" aria-modal="true">
      <h3>Confirm action</h3>
      <p>Are you sure you want to delete this item? This action cannot be undone.</p>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="document.getElementById('overlay').classList.remove('open')">Cancel</button>
        <button class="btn-confirm">Delete</button>
      </div>
    </div>
  </div>
</body>
</html>
