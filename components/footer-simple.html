<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f0f2f7;
      height: 100vh;
      display: grid;
      place-items: center;
    }
    footer {
      background: #171a26;
      color: #9aa3b5;
      width: 100%;
      text-align: center;
      padding: 2rem 1rem;
    }
    footer .title { font-weight: 700; color: #fff; margin-bottom: 0.4rem; font-size: 1.1rem; }
    footer .links { display: flex; justify-content: center; gap: 1.6rem; margin: 0.8rem 0; flex-wrap: wrap; }
    footer .links a { color: #9aa3b5; text-decoration: none; font-size: 0.9rem; }
    footer .links a:hover { color: #6d5dfc; }
    footer .copy { font-size: 0.8rem; }
    footer .socials { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 0.8rem; }
    footer .socials a {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #232838;
      display: grid;
      place-items: center;
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
    }
    footer .socials a:hover { background: #6d5dfc; }
  </style>
</head>
<body>
  <footer>
    <div class="title">ComponentGallery</div>
    <div class="socials">
      <a href="#" aria-label="Twitter">𝕏</a>
      <a href="#" aria-label="GitHub">GH</a>
      <a href="#" aria-label="Discord">D</a>
    </div>
    <div class="links">
      <a href="#">About</a>
      <a href="#">Components</a>
      <a href="#">Contribute</a>
      <a href="#">Contact</a>
    </div>
    <p class="copy">© 2026 ComponentGallery — made with 💖 by the community.</p>
  </footer>
</body>
</html>
