<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #0f1224;
      height: 100vh;
      display: grid;
      place-items: center;
    }
    .btn-glow {
      border: none;
      background: none;
      cursor: pointer;
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      padding: 1rem 2.5rem;
      border-radius: 50px;
      background: linear-gradient(135deg, #6d5dfc, #22c1c3);
      box-shadow: 0 0 20px rgba(109, 93, 252, 0.5);
      transition: all 0.25s ease;
    }
    .btn-glow:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 35px rgba(109, 93, 252, 0.9), 0 0 60px rgba(34, 193, 195, 0.6);
    }
    .btn-glow:active {
      transform: translateY(0) scale(0.97);
    }
  </style>
</head>
<body>
  <button class="btn-glow">Hover me ✨</button>
</body>
</html>
